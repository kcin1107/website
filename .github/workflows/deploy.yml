name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt manuelles Auslösen im GitHub-UI

# Verhindert parallele Deploys, falls schnell hintereinander gepusht wird
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: ./dist/*
          remote_path: / # absoluter Webroot bei IONOS
          sftp_only: true # SFTP über SSH (Port 22), kein FTP
